<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1154" width="100%" role="img" aria-labelledby="fd-title fd-desc"><title id="fd-title">Design: survey experiment</title><desc id="fd-desc">A survey experiment on online panel respondents in United States (N = 2,030 analysed). Respondents are randomly assigned to 12 arms: Flagging, Provenance, Automated Flagging, AI Accuracy Nudge, Breathing Exercise, Mindfulness, Inoculation, AI Literacy Infographic, AI Literacy Infographic 2, AI Literacy Guide, AI Text Video, against the control group Control. Flagging: Posts in the feed are flagged as potentially AI-generated. Provenance: Posts carry information about the content&#x27;s source and origin (provenance). Automated Flagging: Posts carry machine-learning-based AI-detection labels (automated flagging). AI Accuracy Nudge: Before the feed, an interactive task asks &#x27;Is this image AI-generated?&#x27; (accuracy nudge). Breathing Exercise: Before the feed, a box-breathing exercise to reduce emotional reactivity. Mindfulness: Before the feed, a short mindfulness exercise. Inoculation: Before the feed, an inoculation message pre-exposing the respondent to manipulation techniques used in AI-generated media. AI Literacy Infographic: Before the feed, an infographic on how to identify AI-generated content. AI Literacy Infographic 2: Before the feed, an alternative infographic on how to identify AI-generated content. AI Literacy Guide: Before the feed, a comprehensive guide with examples of AI artifacts in images and videos. AI Text Video: Before the feed, an educational video about AI-generated text. Outcomes: Accuracy (share of 24 posts judged correctly), AI attitudes (opportunity vs threat, 6 items), Confidence in AI detection (single 7-point item), Trust in online information (7 items).</desc><style>
:root{--fd-ink:#1c1b19;--fd-muted:#8a877f;--fd-rule:#d9d5cc;--fd-accent:#8b1e2d;--fd-bg:#ffffff}
@media (prefers-color-scheme: dark){:root{--fd-ink:#ecebe6;--fd-muted:#b4b1a9;--fd-rule:#4a4a52;--fd-accent:#e08a96;--fd-bg:#1d1d23}}
.box{fill:var(--fd-bg,#fff);stroke:var(--fd-ink,#1c1b19);stroke-width:1.2}
.arm{fill:var(--fd-bg,#fff);stroke:var(--fd-accent,#8b1e2d);stroke-width:1.4}
.soft{fill:var(--fd-bg,#fff);stroke:var(--fd-rule,#d9d5cc);stroke-width:1.2}
text{font-family:Inter,Helvetica,Arial,sans-serif;fill:var(--fd-ink,#1c1b19);font-size:14px}
.cap{font-size:12px;fill:var(--fd-muted,#8a877f)}
.kicker{font-size:11px;letter-spacing:.08em;fill:var(--fd-muted,#8a877f);text-transform:uppercase}
.edge{stroke:var(--fd-ink,#1c1b19);stroke-width:1.2;fill:none;marker-end:url(#fd-arrow)}
.assoc{stroke-dasharray:5 4}
#fd-arrow path{fill:var(--fd-ink,#1c1b19)}
</style>
<defs><marker id="fd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs><text class="kicker" x="20" y="16">Design: survey experiment</text>
