<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 485" width="100%" role="img" aria-labelledby="fd-title fd-desc"><title id="fd-title">Proposed follow-up: Individual literacy vs system-supplied cue: which carries the effect?</title><desc id="fd-desc">Individual literacy vs system-supplied cue: which carries the effect?. 5 conditions: Control, Real label, Guide only, Label plus Guide, Placebo label. Primary outcome: Accuracy: share of 40 posts judged correctly, with d-prime as a co-primary outcome.. Population: US adults on an online panel, about 300 per arm (1,500 total).</desc><style>
:root{--fd-ink:#1c1b19;--fd-muted:#8a877f;--fd-rule:#d9d5cc;--fd-accent:#8b1e2d;--fd-bg:#ffffff}
@media (prefers-color-scheme: dark){:root{--fd-ink:#ecebe6;--fd-muted:#b4b1a9;--fd-rule:#4a4a52;--fd-accent:#e08a96;--fd-bg:#1d1d23}}
.box{fill:var(--fd-bg,#fff);stroke:var(--fd-ink,#1c1b19);stroke-width:1.2}
.arm{fill:var(--fd-bg,#fff);stroke:var(--fd-accent,#8b1e2d);stroke-width:1.4}
.soft{fill:var(--fd-bg,#fff);stroke:var(--fd-rule,#d9d5cc);stroke-width:1.2}
text{font-family:Inter,Helvetica,Arial,sans-serif;fill:var(--fd-ink,#1c1b19);font-size:14px}
.cap{font-size:12px;fill:var(--fd-muted,#8a877f)}
.kicker{font-size:11px;letter-spacing:.08em;fill:var(--fd-muted,#8a877f);text-transform:uppercase}
.edge{stroke:var(--fd-ink,#1c1b19);stroke-width:1.2;fill:none;marker-end:url(#fd-arrow)}
.assoc{stroke-dasharray:5 4}
#fd-arrow path{fill:var(--fd-ink,#1c1b19)}
</style>
<defs><marker id="fd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs><text class="kicker" x="20" y="16">Proposed follow-up: Individual literacy vs system-supplied cue: which carries the effect?</text>
<g>
<rect class="box" x="20" y="217.5" width="200" height="60" rx="6"/>
<text class="kicker" x="32" y="239.5">Population</text>
<text x="32" y="257.5">US adults on an online</text>
<text x="32" y="275.5">panel, about 300 per</text>
<text x="32" y="293.5">arm (1,500 total).</text>
</g>
<polygon class="box" points="280,223.5 316,247.5 280,271.5 244,247.5"/>
<path class="edge" d="M220,247.5 L242,247.5"/><text class="cap" x="231.0" y="241.5" text-anchor="middle">randomized</text>
<g id="arm-c_control" data-text="No label, no Guide.">
<rect class="arm" x="360" y="30" width="300" height="63" rx="6"/>
<text x="372" y="52">Control</text>
<text class="cap" x="372" y="70">No label, no Guide.</text>
</g>
<path class="edge" d="M318,247.5 L356,61.5"/>
<g id="arm-c_label" data-text="Posts carry machine-learning detection labels.">
<rect class="arm" x="360" y="105" width="300" height="78" rx="6"/>
<text x="372" y="127">Real label</text>
<text class="cap" x="372" y="145">Posts carry machine-learning detection</text>
<text class="cap" x="372" y="160">labels.</text>
</g>
<path class="edge" d="M318,247.5 L356,144.0"/>
<g id="arm-c_guide" data-text="AI Literacy Guide before the feed, no labels.">
<rect class="arm" x="360" y="195" width="300" height="78" rx="6"/>
<text x="372" y="217">Guide only</text>
<text class="cap" x="372" y="235">AI Literacy Guide before the feed, no</text>
<text class="cap" x="372" y="250">labels.</text>
</g>
<path class="edge" d="M318,247.5 L356,234.0"/>
<g id="arm-c_both" data-text="Guide before the feed and real labels on posts.">
<rect class="arm" x="360" y="285" width="300" height="78" rx="6"/>
<text x="372" y="307">Label plus Guide</text>
<text class="cap" x="372" y="325">Guide before the feed and real labels on</text>
<text class="cap" x="372" y="340">posts.</text>
</g>
<path class="edge" d="M318,247.5 L356,324.0"/>
<g id="arm-c_placebo" data-text="Posts carry uninformative labels unrelated to AI status.">
<rect class="arm" x="360" y="375" width="300" height="78" rx="6"/>
<text x="372" y="397">Placebo label</text>
