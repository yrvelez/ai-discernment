<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" role="img" aria-labelledby="fd-title fd-desc"><title id="fd-title">Proposed follow-up: Platform labels vs user training head to head</title><desc id="fd-desc">Platform labels vs user training head to head. 4 conditions: Control, Automated Flagging, AI Literacy Guide, Labels plus Guide. Primary outcome: Total accuracy (share of 24 posts judged correctly) at wave 1, contrast labels vs guide.. Population: US adults from an online panel, about 450 per arm (1,800 total) at wave 1.</desc><style>
:root{--fd-ink:#1c1b19;--fd-muted:#8a877f;--fd-rule:#d9d5cc;--fd-accent:#8b1e2d;--fd-bg:#ffffff}
@media (prefers-color-scheme: dark){:root{--fd-ink:#ecebe6;--fd-muted:#b4b1a9;--fd-rule:#4a4a52;--fd-accent:#e08a96;--fd-bg:#1d1d23}}
.box{fill:var(--fd-bg,#fff);stroke:var(--fd-ink,#1c1b19);stroke-width:1.2}
.arm{fill:var(--fd-bg,#fff);stroke:var(--fd-accent,#8b1e2d);stroke-width:1.4}
.soft{fill:var(--fd-bg,#fff);stroke:var(--fd-rule,#d9d5cc);stroke-width:1.2}
text{font-family:Inter,Helvetica,Arial,sans-serif;fill:var(--fd-ink,#1c1b19);font-size:14px}
.cap{font-size:12px;fill:var(--fd-muted,#8a877f)}
.kicker{font-size:11px;letter-spacing:.08em;fill:var(--fd-muted,#8a877f);text-transform:uppercase}
.edge{stroke:var(--fd-ink,#1c1b19);stroke-width:1.2;fill:none;marker-end:url(#fd-arrow)}
.assoc{stroke-dasharray:5 4}
#fd-arrow path{fill:var(--fd-ink,#1c1b19)}
</style>
<defs><marker id="fd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs><text class="kicker" x="20" y="16">Proposed follow-up: Platform labels vs user training head to head</text>
<g>
<rect class="box" x="20" y="165.0" width="200" height="60" rx="6"/>
<text class="kicker" x="32" y="187.0">Population</text>
<text x="32" y="205.0">US adults from an</text>
<text x="32" y="223.0">online panel, about</text>
<text x="32" y="241.0">450 per arm (1,800</text>
<text x="32" y="259.0">total) at wave 1.</text>
</g>
<polygon class="box" points="280,171.0 316,195.0 280,219.0 244,195.0"/>
<path class="edge" d="M220,195.0 L242,195.0"/><text class="cap" x="231.0" y="189.0" text-anchor="middle">randomized</text>
<g id="arm-c_control" data-text="No intervention before the feed.">
<rect class="arm" x="360" y="30" width="300" height="63" rx="6"/>
<text x="372" y="52">Control</text>
<text class="cap" x="372" y="70">No intervention before the feed.</text>
</g>
<path class="edge" d="M318,195.0 L356,61.5"/>
<g id="arm-c_labels" data-text="Posts carry machine-learning AI-detection labels.">
<rect class="arm" x="360" y="105" width="300" height="78" rx="6"/>
<text x="372" y="127">Automated Flagging</text>
<text class="cap" x="372" y="145">Posts carry machine-learning AI-detection</text>
<text class="cap" x="372" y="160">labels.</text>
</g>
<path class="edge" d="M318,195.0 L356,144.0"/>
<g id="arm-c_guide" data-text="A guide with examples of AI artifacts is shown before the feed.">
<rect class="arm" x="360" y="195" width="300" height="78" rx="6"/>
<text x="372" y="217">AI Literacy Guide</text>
<text class="cap" x="372" y="235">A guide with examples of AI artifacts is</text>
<text class="cap" x="372" y="250">shown before the feed.</text>
</g>
<path class="edge" d="M318,195.0 L356,234.0"/>
<g id="arm-c_both" data-text="Both the guide and the labels.">
<rect class="arm" x="360" y="285" width="300" height="63" rx="6"/>
<text x="372" y="307">Labels plus Guide</text>
<text class="cap" x="372" y="325">Both the guide and the labels.</text>
</g>
<path class="edge" d="M318,195.0 L356,316.5"/>
<g>
<rect class="box" x="700" y="135.0" width="240" height="120" rx="6"/>
<text class="kicker" x="712" y="157.0">Primary outcome</text>
<text x="712" y="175.0">Total accuracy (share of 24</text>
<text x="712" y="193.0">posts judged correctly) at</text>
<text x="712" y="211.0">wave 1, contrast labels vs</text>
<text x="712" y="229.0">guide.</text>
</g>
<path class="edge" d="M660,195.0 L696,195.0"/></svg>