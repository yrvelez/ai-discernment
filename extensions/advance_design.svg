<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 305" width="100%" role="img" aria-labelledby="fd-title fd-desc"><title id="fd-title">Proposed follow-up: Automated detection labels with signal-detection outcomes and a label-accuracy manipulation</title><desc id="fd-desc">Automated detection labels with signal-detection outcomes and a label-accuracy manipulation. 3 conditions: Control, Automated Flagging accurate, Automated Flagging inaccurate. Primary outcome: d-prime computed from AI-post hits and authentic-post false alarms across 24 posts.. Population: US adults from an online panel, about 400 per arm.</desc><style>
:root{--fd-ink:#1c1b19;--fd-muted:#8a877f;--fd-rule:#d9d5cc;--fd-accent:#8b1e2d;--fd-bg:#ffffff}
@media (prefers-color-scheme: dark){:root{--fd-ink:#ecebe6;--fd-muted:#b4b1a9;--fd-rule:#4a4a52;--fd-accent:#e08a96;--fd-bg:#1d1d23}}
.box{fill:var(--fd-bg,#fff);stroke:var(--fd-ink,#1c1b19);stroke-width:1.2}
.arm{fill:var(--fd-bg,#fff);stroke:var(--fd-accent,#8b1e2d);stroke-width:1.4}
.soft{fill:var(--fd-bg,#fff);stroke:var(--fd-rule,#d9d5cc);stroke-width:1.2}
text{font-family:Inter,Helvetica,Arial,sans-serif;fill:var(--fd-ink,#1c1b19);font-size:14px}
.cap{font-size:12px;fill:var(--fd-muted,#8a877f)}
.kicker{font-size:11px;letter-spacing:.08em;fill:var(--fd-muted,#8a877f);text-transform:uppercase}
.edge{stroke:var(--fd-ink,#1c1b19);stroke-width:1.2;fill:none;marker-end:url(#fd-arrow)}
.assoc{stroke-dasharray:5 4}
#fd-arrow path{fill:var(--fd-ink,#1c1b19)}
</style>
<defs><marker id="fd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs><text class="kicker" x="20" y="16">Proposed follow-up: Automated detection labels with signal-detection outcomes and a label-accuracy manipulation</text>
<g>
<rect class="box" x="20" y="127.5" width="200" height="60" rx="6"/>
<text class="kicker" x="32" y="149.5">Population</text>
<text x="32" y="167.5">US adults from an</text>
<text x="32" y="185.5">online panel, about</text>
<text x="32" y="203.5">400 per arm.</text>
</g>
<polygon class="box" points="280,133.5 316,157.5 280,181.5 244,157.5"/>
<path class="edge" d="M220,157.5 L242,157.5"/><text class="cap" x="231.0" y="151.5" text-anchor="middle">randomized</text>
<g id="arm-c_control" data-text="No labels on posts.">
<rect class="arm" x="360" y="30" width="300" height="63" rx="6"/>
<text x="372" y="52">Control</text>
<text class="cap" x="372" y="70">No labels on posts.</text>
</g>
<path class="edge" d="M318,157.5 L356,61.5"/>
<g id="arm-c_accurate" data-text="Each post carries an automated AI-detection label that is correct for all posts.">
<rect class="arm" x="360" y="105" width="300" height="78" rx="6"/>
<text x="372" y="127">Automated Flagging accurate</text>
<text class="cap" x="372" y="145">Each post carries an automated AI-</text>
<text class="cap" x="372" y="160">detection label that is correct for all</text>
</g>
<path class="edge" d="M318,157.5 L356,144.0"/>
<g id="arm-c_wrong" data-text="Each post carries an automated label that is wrong on a fixed 25% of posts.">
<rect class="arm" x="360" y="195" width="300" height="78" rx="6"/>
<text x="372" y="217">Automated Flagging inaccurate</text>
<text class="cap" x="372" y="235">Each post carries an automated label that</text>
<text class="cap" x="372" y="250">is wrong on a fixed 25% of posts.</text>
</g>
<path class="edge" d="M318,157.5 L356,234.0"/>
<g>
<rect class="box" x="700" y="97.5" width="240" height="120" rx="6"/>
<text class="kicker" x="712" y="119.5">Primary outcome</text>
<text x="712" y="137.5">d-prime computed from AI-</text>
<text x="712" y="155.5">post hits and authentic-</text>
<text x="712" y="173.5">post false alarms across 24</text>
<text x="712" y="191.5">posts.</text>
</g>
<path class="edge" d="M660,157.5 L696,157.5"/></svg>